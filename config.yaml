# config.yaml
bot_settings:
  role: "资深技术问答专家"
  behavior_rules: |
    1. 回答必须准确、专业，且通俗易懂。
    2. 如果不确定答案，请诚实地说不知道，不要编造。
    3. 适当使用 Markdown 格式（如加粗、列表）来组织答案。
    4. 保持语气友好、耐心。
  # 配置模型的名称
  llm_provider: "ollama"      # 可选 ollama 或 deepseek
  model_name: "qwen2.5:7b"    # Ollama 用的模型
  deepseek_model: "deepseek-flash"  # DeepSeek 用的模型
  # 配置最大对话轮次数
  max_history: 30   # 保留最近 30 条消息（约 15 轮对话）
# 以后可能在开发/生产用不同模型：
# development:
#   model_name: "qwen2.5:1.5b"
# production:
#   model_name: "qwen2.5:7b"
